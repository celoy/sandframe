[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandframe-toy"
version = "0.0.0"
description = "Reference physics toy for a flipped moving-sand frame"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pygame-ce"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
